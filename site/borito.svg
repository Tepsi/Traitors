<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-label="A Holdvári-kastély sziluettje a telihold előtt">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0b10"/><stop offset=".55" stop-color="#1c1820"/><stop offset="1" stop-color="#2a2428"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f1e6cf" stop-opacity=".55"/><stop offset="1" stop-color="#f1e6cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfc6b8" stop-opacity="0"/><stop offset="1" stop-color="#cfc6b8" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#sky)"/>
  <circle cx="540" cy="300" r="230" fill="url(#glow)"/>
  <circle cx="540" cy="300" r="96" fill="#efe4cc"/>
  <circle cx="575" cy="282" r="86" fill="#1a1620" opacity=".14"/>
  <g fill="#efe4cc" opacity=".7">
    <circle cx="90" cy="110" r="2"/><circle cx="210" cy="60" r="1.5"/><circle cx="330" cy="150" r="2"/><circle cx="700" cy="90" r="2"/>
    <circle cx="150" cy="240" r="1.5"/><circle cx="740" cy="210" r="1.5"/><circle cx="420" cy="70" r="1.5"/>
  </g>
  <!-- domb -->
  <path d="M0 760 Q200 690 400 700 Q620 690 800 750 L800 1000 L0 1000 Z" fill="#0e0c10"/>
  <!-- kastély -->
  <g fill="#0a090d">
    <!-- bal torony -->
    <rect x="160" y="470" width="86" height="240"/>
    <polygon points="150,470 203,375 256,470"/>
    <!-- jobb torony -->
    <rect x="560" y="440" width="96" height="270"/>
    <polygon points="548,440 608,335 668,440"/>
    <!-- bal szárny -->
    <rect x="246" y="560" width="120" height="150"/>
    <polygon points="240,560 306,505 372,560"/>
    <!-- jobb szárny -->
    <rect x="450" y="565" width="110" height="145"/>
    <polygon points="444,565 505,512 566,565"/>
    <!-- középső oromzat -->
    <rect x="366" y="520" width="84" height="190"/>
    <polygon points="354,520 408,420 462,520"/>
    <rect x="396" y="380" width="3" height="42"/>
    <!-- kémények -->
    <rect x="290" y="480" width="14" height="40"/><rect x="520" y="480" width="14" height="40"/>
  </g>
  <!-- ablakok: egyetlen fény -->
  <g fill="#14111a">
    <rect x="190" y="520" width="14" height="30"/><rect x="595" y="500" width="14" height="30"/><rect x="598" y="580" width="14" height="30"/>
    <rect x="280" y="610" width="12" height="26"/><rect x="320" y="610" width="12" height="26"/><rect x="470" y="615" width="12" height="26"/><rect x="510" y="615" width="12" height="26"/>
  </g>
  <rect x="401" y="470" width="14" height="30" fill="#e8c26a"/>
  <rect x="401" y="470" width="14" height="30" fill="#e8c26a" opacity=".5" filter="none"/>
  <!-- kapu -->
  <path d="M391 710 V640 a17 17 0 0 1 34 0 V710 Z" fill="#14111a"/>
  <!-- köd -->
  <rect x="0" y="600" width="800" height="220" fill="url(#mist)"/>
  <ellipse cx="200" cy="760" rx="300" ry="26" fill="#cfc6b8" opacity=".12"/>
  <ellipse cx="620" cy="790" rx="320" ry="30" fill="#cfc6b8" opacity=".14"/>
  <!-- fák -->
  <g fill="#07060a">
    <polygon points="40,780 70,640 100,780"/><polygon points="90,790 125,660 160,790"/>
    <polygon points="690,790 725,650 760,790"/><polygon points="740,780 770,680 800,780"/>
  </g>
</svg>
